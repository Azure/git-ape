# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json

id: negative-billing-history
name: Negative — Historical billing / Cost Management invoice query
description: Querying actual billed usage from Azure Cost Management belongs to a billing/cost-analysis workflow, not the retail-prices-based estimator.
tags: [trigger, negative, mutable-by-skill]
inputs:
  # The heuristic `trigger` grader scores the fraction of prompt tokens found
  # anywhere in SKILL.md, so avoid estimator vocabulary (estimate, actual,
  # real, month) or this scores >= 0.5 deterministically on every model.
  # Keeps the adjacent-domain signal (Azure + Cost Management + resource group).
  prompt: "Export our invoiced Azure spend for the last billing period from Cost Management, broken down by resource group. I need the charges exactly as billed on the invoice — no forecasts or projections."
graders:
  - name: trigger_relevance_negative
    type: trigger
    config:
      skill_path: .github/skills/azure-cost-estimator/SKILL.md
      mode: negative
      threshold: 0.5
