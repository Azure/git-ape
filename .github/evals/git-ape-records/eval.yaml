# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/eval.schema.json

name: git-ape-records-eval
description: Trigger precision and lifecycle truthfulness for native Git-Ape Intent and Evidence records.
skill: git-ape-records
version: "0.1"

config:
  trials_per_task: 1
  timeout_seconds: 120
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6

metrics:
  - name: trigger_precision
    weight: 1.0
    threshold: 0.6
    description: The skill should handle native Intent and Evidence production without claiming governance authority.

graders:
  - type: behavior
    name: budget
    config:
      max_tool_calls: 15
      max_duration_ms: 180000

tasks:
  - "tasks/*.yaml"
