# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/task.schema.json

id: positive-adopt-existing
name: Positive - Adopt existing standalone records
description: Installing ISEE after deployment should validate and bind existing records without regeneration.
tags: [trigger, positive]
inputs:
  prompt: "I deployed demo with standalone Git-Ape, then installed the ISEE suite. The repository already contains the scaffolded adoption command. Adopt the existing intent and evidence by running `bash .github/git-ape/isee/adopt-existing.sh --deployment-id demo --mode optional`, then report the resulting governance state."
  files:
    - path: .azure/deployments/demo/intent.json
      content: |
        {"schema_version":"ape-decision-record/v1","decision_id":"ADR-GIT-APE-DEMO","record_id":"00000000-0000-4000-8000-000000000001","record_version":1,"status":"draft","ratification":null}
    - path: .azure/deployments/demo/template.json
      content: |
        {"resources":[]}
    - path: .azure/deployments/demo/evidence/bundles/run-1.json
      content: |
        {"schema_version":"aerp-evidence-bundle/v1","records":[]}
    - path: .github/git-ape/isee/adopt-existing.sh
      content: |
        #!/usr/bin/env bash
        set -euo pipefail
        test "$*" = "--deployment-id demo --mode optional"
        mkdir -p .azure/deployments/demo
        printf '%s\n' '{"schemaVersion":"git-ape-isee-bindings/v1","deploymentId":"demo","governanceMode":"optional","intentRecords":[{"path":".azure/deployments/demo/intent.json","fingerprint":"sha256:fca0d1e870cf089f211557bac743e5619b38f557081abd87394b40c2e14e14a3","requireRatified":false}],"structureRecords":[],"executionManifest":null,"gates":["intent-fingerprint","approved-artifact-digests"],"evidenceRequirements":["aerp-evidence-bundle/v1"],"artifacts":{"template":{"path":".azure/deployments/demo/template.json","digest":"sha256:1111111111111111111111111111111111111111111111111111111111111111"},"parameters":null,"additional":[]}}' > .azure/deployments/demo/isee-bindings.json
        printf '%s\n' '{"status":"generated","independentlyVerified":false,"reason":"No Evidence bundle passed validation and artifact verification."}' > .azure/deployments/demo/evidence-status.json
        printf '%s\n' '{"intent":{"path":".azure/deployments/demo/intent.json","validation":"authoritative"},"intents":[{"path":".azure/deployments/demo/intent.json","validation":"authoritative"}],"evidence":{"validation":"independent","verifiedBundles":[]}}' > .azure/deployments/demo/isee-adoption.json
graders:
  - name: trigger_relevance_positive
    type: trigger
    config:
      skill_path: .github/skills/git-ape-isee/SKILL.md
      mode: positive
      threshold: 0.5
  - type: prompt
    name: answer_quality
    config:
      continue_session: true
      prompt: |
        Grade the previous response. PASS only if it:
        1. Uses/names `adopt-existing.sh --deployment-id demo --mode optional`,
           or detects that the same adoption has already completed and verifies
           its resulting bindings and adoption report.
        2. Reuses existing ADRP and AERP files instead of regenerating them.
        3. Creates exact-fingerprint `isee-bindings.json`.
        4. Marks Evidence verified only after AERP validation and artifact
           verification; leaving it unverified when no bundle passes is correct.
        5. Does not ratify the Intent automatically.
        If all criteria are met, call `set_waza_grade_pass`; otherwise call
        `set_waza_grade_fail` and identify the missing criteria.
