name: "Git-Ape: Extension Build"

on:
  pull_request:
    paths:
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/copilot/**'
      - '.github/plugin/**'
      - 'plugin.json'
      - 'extension/**'
      - 'APE.png'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Assemble extension payload
        run: |
          set -euo pipefail
          node -e 'const fs = require("fs"); if (fs.statSync("APE.png").size > 1024 * 1024) { console.error("Extension icon exceeds the Marketplace limit of 1 MB"); process.exit(1); }'
          cp LICENSE extension/
          cp APE.png extension/
          cp -r .github extension/.github
          cp extension/package.template.json extension/package.json

      - name: Package VSIX
        working-directory: extension
        run: |
          set -euo pipefail
          vsce package --no-dependencies --allow-missing-repository
          echo "VSIX packaged:"
          ls -lh ./*.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-ape-vsix
          path: extension/*.vsix
          if-no-files-found: error
